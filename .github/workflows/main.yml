name: Snake

# O cron antigo era "* */12 * * *", que dispara a cada minuto durante duas
# horas do dia em vez de duas vezes ao dia.
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"

permissions:
  contents: write

jobs:
  snake:
    name: Grade de contribuicoes animada
    runs-on: ubuntu-latest
    steps:
      # O usuario aqui era "GuilhermeFerro", entao a cobrinha do perfil mostrava
      # as contribuicoes de outra conta.
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
